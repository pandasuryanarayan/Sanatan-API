<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · Sanatan API</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="glass glass-strong auth-card">
    <a class="brand" href="index.html">
      <img src="assets/om-logo.svg" alt="Om" style="width:40px;height:40px;" />
      <span>Sanatan API</span>
    </a>
    <p class="center muted" style="margin-bottom:22px;">Ancient Wisdom. Modern API.</p>

    <div class="switcher" role="tablist">
      <button id="tabLogin" class="active" type="button">Login</button>
      <button id="tabRegister" type="button">Register</button>
    </div>

    <div id="msg" class="msg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Login</button>
      <p class="center muted" style="margin:14px 0 0;font-size:.9rem;">
        <a href="#" id="forgotLink">Forgot password?</a>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="hidden">
      <div class="field">
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input id="regPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required />
      </div>
      <div class="field">
        <label for="regConfirm">Confirm Password</label>
        <input id="regConfirm" type="password" autocomplete="new-password" placeholder="Re-enter password" minlength="8" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="registerBtn">Create Account</button>
      <p class="muted center" style="margin:14px 0 0;font-size:.85rem;">
        We'll email you a verification link to activate your account.
      </p>
    </form>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const S = window.Sanatan;
  const sb = S.getClient();
  const msg = document.getElementById("msg");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");

  function setTab(mode) {
    const isLogin = mode === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabRegister.classList.toggle("active", !isLogin);
    loginForm.classList.toggle("hidden", !isLogin);
    registerForm.classList.toggle("hidden", isLogin);
    S.hideMsg(msg);
  }
  tabLogin.addEventListener("click", () => setTab("login"));
  tabRegister.addEventListener("click", () => setTab("register"));

  if (!sb) { S.showMsg(msg, "Supabase is not configured. Fill in assets/config.js.", "error"); return; }

  // Already signed in? go to dashboard.
  sb.auth.getSession().then(({ data }) => {
    if (data && data.session) window.location.href = "dashboard.html";
  });

  // ---- Login ----
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    S.hideMsg(msg);
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "Logging in…";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value.trim(),
      password: document.getElementById("loginPassword").value,
    });
    btn.disabled = false; btn.textContent = "Login";
    if (error) {
      if (/confirm/i.test(error.message)) {
        S.showMsg(msg, "Please verify your email first — check your inbox for the link.", "error");
      } else {
        S.showMsg(msg, error.message, "error");
      }
      return;
    }
    window.location.href = "dashboard.html";
  });

  // ---- Register ----
  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    S.hideMsg(msg);
    const email = document.getElementById("regEmail").value.trim();
    const pwd = document.getElementById("regPassword").value;
    const confirm = document.getElementById("regConfirm").value;
    if (pwd !== confirm) { S.showMsg(msg, "Passwords do not match.", "error"); return; }

    const btn = document.getElementById("registerBtn");
    btn.disabled = true; btn.textContent = "Creating…";
    const { data, error } = await sb.auth.signUp({
      email,
      password: pwd,
      options: { emailRedirectTo: window.location.origin + "/welcome.html" },
    });
    btn.disabled = false; btn.textContent = "Create Account";
    if (error) { S.showMsg(msg, error.message, "error"); return; }

    // If email confirmation is disabled in Supabase, a session comes back directly.
    if (data && data.session) { window.location.href = "welcome.html"; return; }
    S.showMsg(msg, "Account created. Check your inbox and click the verification link to continue.", "ok");
    registerForm.reset();
  });

  // ---- Forgot password ----
  document.getElementById("forgotLink").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    if (!email) { S.showMsg(msg, "Enter your email above, then click 'Forgot password?'.", "error"); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/login.html",
    });
    if (error) { S.showMsg(msg, error.message, "error"); return; }
    S.showMsg(msg, "Password reset link sent — check your inbox.", "ok");
  });
})();
</script>
</body>
</html>
