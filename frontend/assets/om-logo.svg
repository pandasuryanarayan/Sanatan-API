<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Om">
  <defs>
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="28%" stop-color="#FFD24A"/>
      <stop offset="55%" stop-color="#FF9E1B"/>
      <stop offset="78%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#C24A00"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="50%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#B33F00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#FF8C42" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#FF6A00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="100" r="88" fill="url(#glow)"/>

  <!-- glossy disc -->
  <circle cx="100" cy="100" r="74" fill="url(#goldFace)" filter="url(#drop)"/>
  <circle cx="100" cy="100" r="74" fill="none" stroke="url(#goldRim)" stroke-width="3"/>
  <!-- top specular highlight -->
  <ellipse cx="82" cy="58" rx="42" ry="20" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="74" cy="50" rx="20" ry="9" fill="#FFFFFF" opacity="0.55"/>

  <!-- Om glyph, deep brown for contrast on gold disc -->
  <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif Devanagari','Nirmala UI','Kohinoor Devanagari',serif"
        font-size="104" font-weight="700"
        fill="#4A1D00" stroke="#FFF8DC" stroke-width="2.5"
        paint-order="stroke" filter="url(#soft)">&#2384;</text>
</svg>
