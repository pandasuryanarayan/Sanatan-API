<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verification Successful · Sanatan API</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<main class="welcome-stage">
  <div>
    <div class="om-hero" id="omHero">ॐ</div>
    <h1 class="welcome-title">Verification Successful!</h1>
    <p class="sanskrit" style="font-size:1.35rem;color:#B34700;margin-top:4px;">जय श्री राम</p>
    <p class="muted" id="welcomeSub" style="max-width:460px;margin:14px auto 0;">
      Your Sanatan API account is active. Step into the dashboard to generate your first API key.
    </p>
    <div class="cta-row" style="justify-content:center;margin-top:28px;">
      <a href="dashboard.html" class="btn btn-primary" id="goDash">Go to Dashboard</a>
      <a href="docs.html" class="btn btn-ghost">Read Docs</a>
    </div>
  </div>
</main>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  const S = window.Sanatan;

  // --- GSAP: golden glossy Om pulsing (scale + glow) ---
  const om = document.getElementById("omHero");
  if (window.gsap && om) {
    gsap.set(om, { transformOrigin: "50% 55%" });
    // breathing scale
    gsap.to(om, { scale: 1.08, duration: 1.6, repeat: -1, yoyo: true, ease: "sine.inOut" });
    // glow pulse via drop-shadow filter
    gsap.fromTo(om,
      { filter: "drop-shadow(0 10px 26px rgba(255,140,66,0.40))" },
      { filter: "drop-shadow(0 14px 46px rgba(255,106,0,0.75))", duration: 1.6, repeat: -1, yoyo: true, ease: "sine.inOut" }
    );
    // gentle entrance
    gsap.from(".welcome-title, .cta-row, .sanskrit", { y: 18, opacity: 0, duration: 0.9, stagger: 0.12, delay: 0.2, ease: "power3.out" });
  }

  // --- Confirm the session that Supabase set from the email link ---
  (async function checkSession() {
    const sb = S.getClient();
    if (!sb) return;
    // Give supabase-js a tick to parse the URL hash / code.
    const user = await S.getUser();
    const sub = document.getElementById("welcomeSub");
    if (user && user.email && sub) {
      sub.textContent = "Your Sanatan API account (" + user.email + ") is active. Step into the dashboard to generate your first API key.";
    }
  })();
})();
</script>
</body>
</html>
