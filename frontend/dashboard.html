<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Sanatan API</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><img src="assets/om-logo.svg" alt="Om" /></a>
    <nav class="side-tabs">
      <a class="side-tab active" href="dashboard.html">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="side-tab" href="keys.html">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v4M21 12v3"/></svg>
        API Keys
      </a>
      <a class="side-tab" href="docs.html">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/></svg>
        Docs
      </a>
    </nav>
    <div class="side-foot">
      <a class="side-profile" href="profile.html" id="sideProfile" title="Profile">
        <span class="avatar-side" id="sideAvatar">R</span>
        <span class="side-user" id="sideUser">…</span>
      </a>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn" type="button">Logout</button>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="app-main">
    <div class="app-head">
      <button class="btn btn-ghost btn-sm menu-toggle" id="menuToggle" type="button">☰</button>
      <h1>Dashboard</h1>
      <span class="badge" id="liveBadge" title="Stats auto-refresh every 30s" style="margin-left:auto;">Live · —</span>
      <span class="badge" id="refreshIn" title="Next auto-refresh in">↻ 30s</span>
      <span class="badge plan" id="planBadge">Free tier</span>
    </div>

    <div id="msg" class="msg"></div>

    <!-- Stats -->
    <div class="grid g-4" style="margin-bottom:22px;">
      <div class="glass stat">
        <div class="label">Requests this month</div>
        <div class="value" id="statMonth">—</div>
      </div>
      <div class="glass stat">
        <div class="label">Requests today</div>
        <div class="value" id="statToday">—</div>
      </div>
      <div class="glass stat">
        <div class="label">Monthly quota</div>
        <div class="value" id="statQuota">—</div>
      </div>
      <div class="glass stat">
        <div class="label">Current plan</div>
        <div class="value" id="statPlan" style="font-size:1.3rem;">Free</div>
      </div>
    </div>

    <!-- Chart -->
    <div class="glass" style="margin-bottom:22px;">
      <h3 style="margin-top:0;">Usage — last 7 days</h3>
      <div style="height:280px;"><canvas id="usageChart"></canvas></div>
      <div id="perfLine" class="muted" style="font-size:.78rem;margin-top:8px;">—</div>
    </div>

    <!-- Recent calls -->
    <div class="glass" style="padding:0;">
      <div style="padding:22px 24px 8px;"><h3 style="margin:0;">Recent API calls</h3></div>
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr><th>Endpoint</th><th>Status</th><th>Time</th></tr></thead>
          <tbody id="callsBody">
            <tr><td colspan="3" class="muted" style="text-align:center;padding:30px;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
  const S = window.Sanatan;
  const msg = document.getElementById("msg");
  const callsBody = document.getElementById("callsBody");
  const liveBadge = document.getElementById("liveBadge");
  const refreshBadge = document.getElementById("refreshIn");
  let chart = null;

  const REFRESH_MS = 30000;
  let timer = null;
  let inFlight = false;
  let countdownSec = REFRESH_MS / 1000;

  function stampLive() {
    if (!liveBadge) return;
    liveBadge.textContent = "Live · " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function paintCountdown() {
    if (!refreshBadge) return;
    refreshBadge.textContent = "↻ " + Math.max(countdownSec, 0) + "s";
  }

  function resetCountdown() {
    countdownSec = REFRESH_MS / 1000;
    paintCountdown();
  }

  S.wireSidebar();
  document.getElementById("logoutBtn").addEventListener("click", () => S.logout());

  function codeClass(code) {
    if (code < 300) return "ok";
    if (code < 500) return "warn";
    return "err";
  }

  function drawChart(labels, values) {
    // Reuse the chart object across refreshes — updating data in place
    // avoids destroy/create churn (GC pauses) every 30s.
    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
      return;
    }
    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
      return;
    }
    const ctx = document.getElementById("usageChart").getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 280);
    grad.addColorStop(0, "rgba(255,140,66,0.45)");
    grad.addColorStop(1, "rgba(255,140,66,0.02)");
    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: "Requests",
          data: values,
          fill: true,
          backgroundColor: grad,
          borderColor: "#FF6A00",
          borderWidth: 2.5,
          tension: 0.4,
          pointBackgroundColor: "#FF6A00",
          pointBorderColor: "#fff",
          pointRadius: 4,
          pointHoverRadius: 6,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: "rgba(255,140,66,0.10)" }, ticks: { color: "#8D6E63", precision: 0 } },
          x: { grid: { display: false }, ticks: { color: "#8D6E63" } },
        },
      },
    });
  }

  function renderCalls(recent) {
    if (!recent || !recent.length) {
      callsBody.innerHTML = '<tr><td colspan="3" class="muted" style="text-align:center;padding:30px;">No calls logged yet. Make a request with your API key.</td></tr>';
      return;
    }
    callsBody.innerHTML = recent.map(c => `
      <tr>
        <td class="mono">${S.esc(c.endpoint)}</td>
        <td><span class="status-code ${codeClass(c.status_code)}">${S.esc(c.status_code)}</span></td>
        <td class="muted">${S.fmtDate(c.timestamp)}</td>
      </tr>`).join("");
  }

  // Paint in stages so something useful appears fast on slow networks:
  // numbers first, then chart, then table — one frame between each.
  function frame() {
    return new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  }

  function heapMB() {
    try {
      if (window.performance && performance.memory) {
        return (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB heap";
      }
    } catch {}
    return "heap n/a (non-Chromium)";
  }

  function paintPerf(ms, dailyLen, recentLen) {
    const el = document.getElementById("perfLine");
    if (el) el.textContent = `stats in ${Math.round(ms)} ms · ${dailyLen} day-buckets · ${recentLen} calls · ${heapMB()}`;
  }

  // Live backends sleep when idle: the first call after a while can take
  // several seconds (cold start) and hit the timeout. Retry once — the
  // first attempt wakes the machine, the second one gets the data.
  async function fetchStats() {
    try {
      return await S.api("/api/usage/stats", { timeout: 25000 });
    } catch (e) {
      if (!/timed out/i.test(e.message || "")) throw e;
      const perf = document.getElementById("perfLine");
      if (perf) perf.textContent = "Waking up the server, retrying…";
      return await S.api("/api/usage/stats", { timeout: 25000 });
    }
  }

  async function load() {
    const t0 = (window.performance && performance.now()) || Date.now();
    try {
      const d = await fetchStats();
      document.getElementById("statMonth").textContent = (d.total_this_month ?? 0).toLocaleString("en-IN");
      document.getElementById("statToday").textContent = (d.today ?? 0).toLocaleString("en-IN");
      document.getElementById("statQuota").innerHTML = (d.quota ?? S.cfg.FREE_TIER_MONTHLY).toLocaleString("en-IN") + ' <small>/ month</small>';
      document.getElementById("statPlan").textContent = d.plan || "Free";
      document.getElementById("planBadge").textContent = (d.plan || "Free") + " tier";
      await frame();

      const daily = d.daily || [];
      drawChart(daily.map(x => x.date), daily.map(x => x.count));
      await frame();

      renderCalls(d.recent);
      S.hideMsg(msg);
      stampLive();
      paintPerf(((window.performance && performance.now()) || Date.now()) - t0, daily.length, (d.recent || []).length);
    } catch (e) {
      S.showMsg(msg, e.message + " — is the backend running?", "error");
      // graceful empty chart
      drawChart([], []);
      renderCalls([]);
    }
  }

  // Refresh without a page reload. Skips while a fetch is in flight
  // or the tab is hidden (browsers throttle hidden tabs anyway).
  // Every successful refresh restarts the visible 30s countdown.
  async function tick() {
    if (document.hidden || inFlight) return;
    inFlight = true;
    try { await load(); } finally { inFlight = false; resetCountdown(); }
  }

  // 1s driver: counts 20→0 on screen; fires the refresh at zero.
  function second() {
    if (document.hidden) return;
    if (countdownSec <= 0) return; // refresh already running, wait for it
    countdownSec--;
    if (countdownSec <= 0) tick();
    else paintCountdown();
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    resetCountdown();
    timer = setInterval(second, 1000);
    document.addEventListener("visibilitychange", tick);
    window.addEventListener("pagehide", stopAutoRefresh);
  }

  function stopAutoRefresh() {
    if (timer) { clearInterval(timer); timer = null; }
    document.removeEventListener("visibilitychange", tick);
    window.removeEventListener("pagehide", stopAutoRefresh);
  }

  (async function boot() {
    await S.ready();
    const user = await S.requireAuth();
    if (!user) return;
    document.getElementById("sideUser").textContent = user.email || "";
    const sideAvatar = document.getElementById("sideAvatar");
    sideAvatar.textContent = S.getInitial(user);
    document.getElementById("sideProfile").title = S.getDisplayName(user) || user.email || "Profile";
    await load();
    startAutoRefresh();
  })();
})();
</script>
</body>
</html>
